name: Release Knap

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The root tests and typecheck import website code that needs CodeMirror.
      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Check package
        run: pnpm check
      - name: Pack release
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
      - name: Package VS Code extension
        working-directory: editors/vscode
        run: pnpm dlx @vscode/vsce@3.9.2 package --out ../../release/knap.vsix
      - name: Package Sublime Text extension
        working-directory: editors/sublime
        run: zip -9 -r ../../release/Knap.sublime-package . -x "syntax_test_*"
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Publish to npm
        run: npm publish ./release/*.tgz --access public --provenance
      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title="$GITHUB_REF_NAME" \
            --draft \
            release/*
